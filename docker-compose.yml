name: kafka-flink-doris

services:
  # ---------------------------------------------------------------
  # Kafka (KRaft mode, single node: broker + controller, tanpa Zookeeper)
  # Total RAM container: 1 GB (heap JVM 512 MB + page cache/off-heap)
  # ---------------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"   # akses dari host (laptop)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      # INTERNAL -> dipakai antar container (Flink, Doris), EXTERNAL -> dipakai dari host
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # single node -> semua replication factor = 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 24      # hemat disk, cukup untuk belajar
      # Limit memori JVM
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 1g
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------
  # Kafka Connect (distributed mode, 1 worker)
  # RAM: heap 512 MB, container limit 1 GB
  # REST API -> http://localhost:8083
  # ---------------------------------------------------------------
  kafka-connect:
    image: confluentinc/cp-kafka-connect:7.8.0
    container_name: kafka-connect
    hostname: kafka-connect
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:19092
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: connect-cluster
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    mem_limit: 1g
    networks:
      - data-net
    depends_on:
      kafka:
        condition: service_healthy

  # ---------------------------------------------------------------
  # Kafka UI -> http://localhost:8080
  # RAM: heap 256 MB, container limit 512 MB
  # ---------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
      DYNAMIC_CONFIG_ENABLED: "true"
      JAVA_OPTS: "-Xms128m -Xmx256m"
    mem_limit: 512m
    networks:
      - data-net
    depends_on:
      kafka:
        condition: service_healthy
      kafka-connect:
        condition: service_started

  # ---------------------------------------------------------------
  # Flink JobManager
  # RAM: process.size 1024m, container limit 1200m (ada margin)
  # ---------------------------------------------------------------
  flink-jobmanager:
    image: flink:1.20-java17
    container_name: flink-jobmanager
    hostname: flink-jobmanager
    command: jobmanager
    ports:
      - "8081:8081"   # Flink Web UI -> http://localhost:8081
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1024m
        rest.flamegraph.enabled: false
    volumes:
      - ./flink/lib/flink-sql-connector-kafka.jar:/opt/flink/lib/flink-sql-connector-kafka.jar:ro
      - ./flink/sql:/opt/flink/sql:ro
    mem_limit: 1200m
    networks:
      - data-net
    depends_on:
      kafka:
        condition: service_healthy

  # ---------------------------------------------------------------
  # Flink TaskManager
  # RAM: process.size 1536m, container limit 1700m, 2 slot
  # ---------------------------------------------------------------
  flink-taskmanager:
    image: flink:1.20-java17
    container_name: flink-taskmanager
    hostname: flink-taskmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        taskmanager.memory.process.size: 1536m
    volumes:
      - ./flink/lib/flink-sql-connector-kafka.jar:/opt/flink/lib/flink-sql-connector-kafka.jar:ro
      - ./flink/sql:/opt/flink/sql:ro
    mem_limit: 1700m
    networks:
      - data-net
    depends_on:
      - flink-jobmanager

networks:
  data-net:
    name: data-net   # dipakai juga nanti oleh docker-compose Doris

volumes:
  kafka-data:
